# BLOCKING PIN — do not remove without bumping Robolectric first.
#
# Robolectric 4.13 ships shadows up to API 34. The app builds with targetSdk 36, and
# Robolectric reads the merged manifest, so without this pin every Robolectric test dies
# at setup with:
#
#   java.lang.IllegalArgumentException: Package targetSdkVersion=36 > maxSdkVersion=34
#
# which fails `:app:testDebugUnitTest` 100 %. That command is the stated validation for
# roughly twenty steps of this port and is acceptance criterion #1 — including the 27/27
# conformance run that is the entire cross-platform parity proof. Pinning the emulated
# SDK to 34 is the verified fix.
#
# The alternative is Robolectric 4.16+, which supports API 36 and makes this file
# unnecessary. 4.13 + this pin is the combination that was actually verified, so both
# move together or neither does.
#
# Note: the pure contract layer (plan Phase B, Steps 7-20) carries no `android.*` imports
# and needs no Robolectric at all. This pin exists to protect Phases D-J — Room,
# DataStore, the crop pipeline and the Compose screens — which do.
sdk=34
