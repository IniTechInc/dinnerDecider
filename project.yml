name: DinnerDecider
options:
  bundleIdPrefix: com.philwoolley
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  xcodeVersion: "26.3"

packages:
  LocalLLMClient:
    url: https://github.com/tattn/LocalLLMClient.git
    exactVersion: "0.5.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: AXW4GKUTKZ
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  DinnerDecider:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - DinnerDecider
    dependencies:
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philwoolley.dinnerdecider
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_INTEROP_MODE: objcxx
        CODE_SIGN_ENTITLEMENTS: DinnerDecider/DinnerDecider.entitlements
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development: woolley.pj@gmail.com (38P6V2YYLU)"
        PROVISIONING_PROFILE_SPECIFIER: DinnerDecider Development
    info:
      path: DinnerDecider/Info.plist
      properties:
        CFBundleDisplayName: DinnerDecider
        NSCameraUsageDescription: DinnerDecider uses the camera to photograph your fridge and pantry so it can identify your food.
        NSPhotoLibraryUsageDescription: DinnerDecider uses your photo library so you can pick photos of your fridge and pantry to identify your food.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - DMSerifDisplay-Regular.ttf
          - DMSerifDisplay-Italic.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  DinnerDeciderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - DinnerDeciderTests
    dependencies:
      - target: DinnerDecider
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.philwoolley.dinnerdecider.tests
        SWIFT_OBJC_INTEROP_MODE: objcxx

schemes:
  DinnerDecider:
    build:
      targets:
        DinnerDecider: all
        DinnerDeciderTests: [test]
    test:
      targets:
        - DinnerDeciderTests
    run:
      config: Debug
