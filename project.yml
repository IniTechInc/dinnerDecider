name: dinnerDecider
options:
  bundleIdPrefix: com.initech
  deploymentTarget:
    iOS: "18.0"
  defaultConfig: Debug
  xcodeVersion: "16.0"

# KAN-7: LocalLLMClient as local package (MLX dependency stripped to avoid submodule issues)
packages:
  LocalLLMClient:
    path: LocalLLMClient

targets:
  dinnerDecider:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - Sources/dinnerDecider
    resources:
      - path: Sources/dinnerDecider/Resources
        optional: true
    info:
      path: Sources/dinnerDecider/Supporting Files/Info.plist
      properties:
        CFBundleDisplayName: dinnerDecider
        NSCameraUsageDescription: "dinnerDecider photographs your fridge and pantry to identify food items on-device."
        NSPhotoLibraryUsageDescription: "dinnerDecider imports photos of your food to identify items on-device."
        NSPhotoLibraryAddUsageDescription: "dinnerDecider saves scan photos to your library."
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations: {}
    dependencies:
      - package: LocalLLMClient
        product: LocalLLMClient
      - package: LocalLLMClient
        product: LocalLLMClientLlama
    settings:
      base:
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.initech.dinnerDecider
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        CLANG_ENABLE_EXPLICIT_MODULES: NO
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        OTHER_SWIFT_FLAGS: "-cxx-interoperability-mode=default"
    scheme:
      testTargets:
        - dinnerDeciderTests

  dinnerDeciderTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests/dinnerDeciderTests
    dependencies:
      - target: dinnerDecider
    settings:
      base:
        SWIFT_VERSION: "5.0"
